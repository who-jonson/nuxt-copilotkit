packages:
  - documentation

allowBuilds:
  '@scarf/scarf': true
  better-sqlite3: false
  esbuild: false
  inotify: false
  unrs-resolver: false
  vue-demi: false
  workerd: false

catalogs:
  prod:
    '@copilotkit/runtime': ^1.80.0
    '@copilotkit/vue': ^1.80.0
    '@nuxt/devtools-kit': ^3.4.4
    '@nuxt/kit': ^4.6.2
    sirv: ^3.0.2
  dev:
    '@barzhsieh/nuxt-content-mermaid': ^4.0.1
    '@iconify-json/carbon': ^1.2.29
    '@nuxt/content': 3.16.2
    '@nuxt/devtools': ^3.4.4
    '@nuxt/devtools-ui-kit': ^3.4.4
    '@nuxt/eslint-config': ^1.17.0
    '@nuxt/module-builder': ^1.0.3
    '@nuxt/schema': ^4.6.2
    '@nuxt/test-utils': ^4.3.4
    '@types/node': latest
    '@typescript/native': npm:typescript@^7.0.2
    changelogen: ^0.6.2
    docus: ^5.15.0
    eslint: ^10.13.0
    nuxt: ^4.6.2
    rxjs: ^7.8.2
    skills-npm: ^4.1.0
    typescript: npm:@typescript/typescript6@^6.0.2
    vitest: ^5.0.5
    vue-tsc: ^3.3.13
    wrangler: ^4.152.0

catalogMode: strict

shamefullyHoist: true

strictPeerDependencies: false

# @ag-ui/client pins rxjs 7.8.1; force a single copy so Observable types match across packages.
overrides:
  rxjs: catalog:dev
